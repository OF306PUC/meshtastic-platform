# deployments/san-joaquin-longturbo.yaml — the San Joaquín campus testbed AS IT
# RUNS TODAY: LONG_TURBO, on the slot the firmware hashes from the channel name.
#
# `san-joaquin.yaml` is the TARGET (MEDIUM_FAST, slot 45 explicit). Until those
# radios are re-provisioned, a receiver configured from that file hears NOTHING
# from them: different preset, different frequency, no error — just silence.
# This file exists so a receiver can be provisioned to what is actually on air,
# and so the data it records is labelled with the preset it was taken under
# (`channel_study.session.load_sessions` refuses to pool sessions across
# presets, which is exactly the mistake this prevents).
#
# What is on air today, from the old monorepo
# (~/Desktop/Personal-AI-Studio/meshtastic-testbed-platform):
#   src/common/radio_config.py   LORA_PRESET = "LONG_TURBO"  # Ideally: MEDIUM_FAST
#                                telCPS_RTC / msgPUC_NET, precision 32, ANZ
#   mesh_config.json             node ids, hop_limit 2, cadences, positions
#   psks.txt                     LORA_TELEMETRY_CHANNEL_PSK, LORA_MSG_CHANNEL_PSK
#                                — the same variable names this platform reads
#                                from .env
#
# Only R1 is provisioned from this file. The field nodes keep running as they
# are; their entries are here because the receiver needs their node ids (to name
# a sender), their cadences (to announce a silence) and their antennas and power
# (every reception record carries both ends). Nothing here re-provisions them.
#
#   1. Put the two campus keys in .env (they are placeholders today):
#        grep -E '^LORA_(TELEMETRY|MSG)' ~/Desktop/Personal-AI-Studio/\
#          meshtastic-testbed-platform/psks.txt >> .env
#      Then delete the `base64:CHANGE_ME` lines for those two variables: the
#      loader keeps the FIRST occurrence of a name.
#   2. python configure.py validate -d san-joaquin-longturbo
#   3. python configure.py inspect -d san-joaquin-longturbo --port <port>
#      Record R1's node_id, mac and firmware below. A T-Beam already registered
#      in another deployment is refused on purpose — use a free one.
#   4. python configure.py provision -d san-joaquin-longturbo --node R1 --port <port>
#   5. python receiver.py -d san-joaquin-longturbo --port <port> \
#        --csv runs/<date>/ --operator <name> --track-secs 30
#
# When the campus is re-provisioned to MEDIUM_FAST, this file becomes
# `kind: historical` — kept so the data taken under it can still be read.
#
# Labels keep the names the data was published under ("node-1"), so old and
# new series still join.

meta:
  deployment: san-joaquin-longturbo
  kind: field
  description: San Joaquín campus testbed as installed — LONG_TURBO, hashed slot
  firmware_target: "2.7.26"      # nodes 1-3 run 2.7.26 (commit 54e0d8d)

radio:
  region: ANZ
  modem_preset: LONG_TURBO       # what these radios actually run (SF11/125 kHz)
  # NOT the team slot plan's LONG_TURBO 14 (921.750 MHz): these radios were set
  # up before the plan existed and `lora.channel_num` was never written, so the
  # firmware hashes the PRIMARY channel name (djb2 of telCPS_RTC) and lands on
  # slot 17 of 26 = 923.250 MHz. Written explicitly because V7 refuses an
  # implicit slot on a live mesh — and because a receiver that derives it from a
  # name would silently follow the name if someone ever edited it. The value is
  # what the nodes compute: `configure.py show` prints the frequency.
  channel_num: 17
  channels:                      # same names and keys on every radio of the mesh
    - {index: 0, name: telCPS_RTC, psk_env: LORA_TELEMETRY_CHANNEL_PSK}
    - {index: 1, name: msgPUC_NET, psk_env: LORA_MSG_CHANNEL_PSK}
  rebroadcast_mode: LOCAL_ONLY
  position_precision: 32         # full precision: the sender masks the rest away for good
  rx_boosted_gain: true
  # Chile, SUBTEL Res. Ex. 1.985/2017 (Norma Técnica de Equipos de Alcance
  # Reducido), read as EIRP — the conservative reading of "potencia radiada".
  eirp_caps:
    - {band_mhz: [915, 928], eirp_dbm: 27, label: "SUBTEL j.3"}
    - {band_mhz: [913, 919], eirp_dbm: 30, label: "SUBTEL j.4"}
    - {band_mhz: [925, 928], eirp_dbm: 30, label: "SUBTEL j.4"}

nodes:
  - ref: "1"
    label: node-1
    function: node
    status: deployed
    node_id: "!0b64122b"
    hardware: sensecap_solar_node_p1_pro
    mcu: nrf52840
    firmware: "2.7.26"
    role: CLIENT                 # was CLIENT_BASE; the role belongs on the high, far node (plan §2.6)
    hop_limit: 2
    antenna:                     # SenseCAP stock rubber antenna — confirm none was replaced
      type: rubber
      gain_dbi: 2.0
      band_mhz: [902, 928]
      model: SenseCAP stock
    tx_power_dbm: 22
    site:
      # alt: mesh_config.json carried 0 for every node — a placeholder, not a survey.
      surveyed: {lat: -33.4969028, lon: -70.6101277778, alt_m: null}
    intervals: {device: 120, environment: 120, position: 600}
    sensors:
      - {type: SHT4X, i2c_addr: "0x44", port: grove}

  - ref: "2"
    label: node-2
    function: node
    status: deployed
    node_id: "!7c70da02"
    hardware: sensecap_solar_node_p1_pro
    mcu: nrf52840
    firmware: "2.7.26"
    role: CLIENT
    hop_limit: 2
    antenna: {type: rubber, gain_dbi: 2.0, band_mhz: [902, 928], model: SenseCAP stock}
    tx_power_dbm: 22
    site:
      surveyed: {lat: -33.4971361, lon: -70.6075444443, alt_m: null}
    intervals: {device: 120, environment: 120, position: 600}
    sensors:
      - {type: SHT4X, i2c_addr: "0x44", port: grove}

  - ref: "3"
    label: node-3
    function: node
    status: deployed
    node_id: "!32fe0d4e"
    hardware: sensecap_solar_node_p1_pro
    mcu: nrf52840
    firmware: "2.7.26"
    role: CLIENT_BASE            # was CLIENT (plan §2.6)
    hop_limit: 2
    antenna: {type: rubber, gain_dbi: 2.0, band_mhz: [902, 928], model: SenseCAP stock}
    tx_power_dbm: 22
    site:
      surveyed: {lat: -33.5002389, lon: -70.6119222222, alt_m: null}
    intervals: {device: 120, environment: 120, position: 600}
    sensors:
      - {type: SHT4X, i2c_addr: "0x44", port: grove}

  # PBX radios. Per the 2026-09-02 analysis they never delivered a position
  # packet against their declared 1800 s cadence: the receiver will report that
  # flow as silent until the GPS gets a fix, or until `position` is removed.
  - ref: p1
    label: node-p1
    function: pbx
    status: planned              # installed; firmware not yet recorded
    node_id: "!bb8106c4"
    hardware: lilygo_tbeam_sx1276
    mcu: esp32
    firmware: null
    role: CLIENT
    hop_limit: 2
    antenna: {type: rubber, gain_dbi: 2.0, band_mhz: null, model: LILYGO stock}   # assumed stock: confirm
    tx_power_dbm: 20             # SX1276: the chip ceiling (RF95_MAX_POWER) binds
    pbx:
      mcu: nrf52840              # nRF52840 DK prototype
      firmware: null
    site:
      name: MIDE
      surveyed: {lat: -33.4969028, lon: -70.610127778, alt_m: null}
    intervals: {device: 600, position: 1800}
    sensors: []

  - ref: p2
    label: node-p2
    function: pbx
    status: planned              # installed; firmware not yet recorded
    node_id: "!6c743130"
    hardware: lilygo_tbeam_sx1276
    mcu: esp32
    firmware: null
    role: CLIENT
    hop_limit: 2
    antenna: {type: rubber, gain_dbi: 2.0, band_mhz: null, model: LILYGO stock}   # assumed stock: confirm
    tx_power_dbm: 20
    pbx:
      mcu: nrf52840
      firmware: null
    site:
      name: DIE
      surveyed: {lat: -33.4999417, lon: -70.614008333, alt_m: null}
    intervals: {device: 600, position: 1800}
    sensors: []

  # The gateway: a LILYGO T-Beam on USB to a Raspberry Pi (5G HAT under study).
  # Its node_id was never recorded — read it with the inspector.
  - ref: gw
    function: gateway
    status: planned
    node_id: null
    hardware: lilygo_tbeam_sx1276
    mcu: esp32
    firmware: null
    role: CLIENT_MUTE
    hop_limit: 2
    antenna: {type: rubber, gain_dbi: 2.0, band_mhz: null, model: LILYGO stock}
    tx_power_dbm: 20             # SX1276: the chip ceiling (RF95_MAX_POWER) binds
    intervals: {}
    sensors: []

  # The sniffer: a LILYGO T-Beam on USB to a laptop, running receiver.py. Never
  # relays (I5), so it cannot alter what it measures. One position every 900 s is
  # all the mesh sees of it; the route comes from --track-secs over USB, which
  # costs no airtime (its GPS fixes every 30 s: plan.GPS_UPDATE_INTERVAL_S).
  # Drop `position` from its intervals to keep it off the air entirely — then
  # there is no track either, because provision turns the GPS off without a flow.
  - ref: R1
    function: receiver
    status: planned              # a laptop radio: it has no site
    node_id: "!6c72f308"                # read it with `configure.py inspect`
    mac: "A0:DD:6C:72:F3:08"
    hardware: lilygo_tbeam_sx1276
    mcu: esp32
    firmware: "2.7.26"
    role: CLIENT_MUTE
    hop_limit: 1
    antenna: {type: rubber, gain_dbi: 2.0, band_mhz: null, model: LILYGO stock}
    tx_power_dbm: 20             # SX1276: the chip ceiling (RF95_MAX_POWER) binds
    intervals: {position: 900}
    sensors: []
