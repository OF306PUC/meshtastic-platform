  # ── Gateway: a LILYGO on USB to its host (Raspberry Pi or Jetson) ────────────
  # The host runs meshtastic-gateway. Expected at the SASIPA plant (Central
  # SASIPA), to be confirmed like every other site.
  - ref: GW
    function: gateway
    status: planned
    node_id: null
    mac: null
    hardware: lilygo_tbeam_sx1276
    mcu: esp32
    firmware: null
    role: CLIENT_MUTE            # hears and never relays: it must not contaminate its own measurement (I5)
    hop_limit: 1
    antenna:
      type: rubber
      gain_dbi: 2.0
      band_mhz: null             # LILYGO stock antenna: band not recorded yet
      model: LILYGO stock
      connector_loss_db: null
    tx_power_dbm: 20             # SX1276: the chip ceiling (RF95_MAX_POWER) binds
    site:
      name: null
      asset_code: null
      surveyed: {lat: null, lon: null, alt_m: null, alt_source: null}
      antenna_height_m: null
      mount: null
    # The sink: telemetry and GPS off, so it broadcasts no measured flow. No
    # sensor either — it would measure the inside of the building (S2).
    intervals: {}
    sensors: []

  # ── Channel-study receivers: a LILYGO on a PC running receiver.py ────────────
  # In the registry so their firmware is held to V5 too — the receiving radio's
  # sensitivity is part of every measurement it takes — and so every record
  # names the antenna it was received on.
  #
  # GPS on with a SLOW position flow: 900 s is what each receiver puts on air
  # (the firmware's own default, so the channel it measures pays for one packet
  # every 15 min), while `receiver.py --track-secs 30` samples the fix over USB
  # for the route. `gps_update_interval` is 30 s on a receiver, so the track has
  # that resolution without any of it costing airtime. A receiver that will not
  # move needs no flow at all: set `intervals: {}` and record the point in
  # `site` instead.
  - ref: R1
    function: receiver
    status: planned
    node_id: null
    mac: null
    hardware: lilygo_tbeam_sx1276
    mcu: esp32
    firmware: null
    role: CLIENT_MUTE
    hop_limit: 1
    antenna:
      type: rubber
      gain_dbi: 2.0
      band_mhz: null
      model: LILYGO stock
      connector_loss_db: null
    tx_power_dbm: 20             # SX1276: the chip ceiling (RF95_MAX_POWER) binds
    site:
      name: null
      asset_code: null
      surveyed: {lat: null, lon: null, alt_m: null, alt_source: null}
      antenna_height_m: null
      mount: null
    intervals: {position: 900}   # on air; the route is sampled over USB
    sensors: []

  - ref: R2
    function: receiver
    status: planned
    node_id: null
    mac: null
    hardware: lilygo_tbeam_sx1276
    mcu: esp32
    firmware: null
    role: CLIENT_MUTE
    hop_limit: 1
    antenna:
      type: rubber
      gain_dbi: 2.0
      band_mhz: null
      model: LILYGO stock
      connector_loss_db: null
