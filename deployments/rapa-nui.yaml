    tx_power_dbm: 22
    site:
      name: null
      asset_code: null
      surveyed: {lat: null, lon: null, alt_m: null, alt_source: null}
      antenna_height_m: null
      mount: null
    intervals: {device: 120, environment: 120, position: 3600}
    sensors:
      - {type: SHT4X, i2c_addr: "0x44", port: grove}

  - ref: N3
    function: node
    status: planned
    node_id: null
    mac: null
    hardware: sensecap_solar_node_p1_pro
    mcu: nrf52840
    firmware: null
    role: CLIENT
    hop_limit: 1
    antenna:
      type: rubber
      gain_dbi: 2.0
      band_mhz: [902, 928]
      model: SenseCAP stock
      connector_loss_db: null
    tx_power_dbm: 22
    site:
      name: null
      asset_code: null
      surveyed: {lat: null, lon: null, alt_m: null, alt_source: null}
