  # N4–N6 carry no sensor: NO `environment` key — not null, not 0: absent (V3b).
  - ref: N4
    function: node
    status: planned
    node_id: null
    mac: null
    hardware: sensecap_solar_node_p1_pro
    mcu: nrf52840
    firmware: null
    role: CLIENT
    hop_limit: 1
    antenna:
      type: rubber
